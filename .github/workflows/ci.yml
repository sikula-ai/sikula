name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Compile check
        run: python3 -m compileall -q agents/ core/ sikula_cli/ tools/ sikula.py
      - name: Test
        run: python3 -m pytest tests/ -v --cov=sikula --cov=agents --cov=core --cov=sikula_cli --cov=tools --cov-branch --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
      - name: Lint
        run: python3 -m ruff check .
      - name: Format check
        run: python3 -m ruff format --check .

  windows-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile check
        run: python -m compileall -q agents/ core/ sikula_cli/ tools/ sikula.py
      - name: Test
        run: python -m pytest tests/ -v
