# Sikula — orchestrator configuration for running Sikula on itself.
#
# This config is used when Sikula runs tasks against its own codebase.
# It also serves as a reference Python/PythonTool config. The common
# development install is editable (`pipx install --editable .` or `pip install
# -e .`), so prefer isolated worktree runs for changes to Sikula's own CLI,
# orchestrator, providers, state, worktree, and delivery code.
#
# Use Sikula's contract-first flow from the repo root:
#   sikula contract check .sikula/tasks/<task-file>
#   sikula task refine .sikula/tasks/<task-file> --output .sikula/tasks/<task-file>.refined.md
#   sikula contract prepare .sikula/tasks/<task-file>.refined.md --output .sikula/contracts/<task-file>.contract.md
#   sikula run .sikula/contracts/<task-file>.contract.md --require-contract-ready

project:
  name: sikula
  root_path: .
  build_tool: python

  # Tech stack — injected into agent prompts (analyst, implementer, reviewer, security reviewer,
  # fixer, test writer). Adapt these values to match your project.
  language: Python

sandbox:
  # Production write scope for implementer and production-code fixer passes.
  # These paths are prompt constraints, not a provider-independent hard sandbox.
  # Sikula audits detected file changes after write-capable agent calls and records
  # write_path_warning if a change is outside the active write scope.
  # Governance docs/config paths are included so explicit Sikula self-hosting
  # tasks can update documentation, architecture notes, and config. They should
  # not change as incidental implementation output.
  # Role-specific .sikula/*_rules.md prompt overlays are intentionally omitted
  # from write scope; update them as explicit maintainer changes and commit them
  # before the next isolated run.
  # GitHub Actions workflows are security-sensitive and intentionally omitted;
  # add .github/workflows/ only for explicit maintainer-approved CI tasks.
  allowed_write_paths:
    - agents/
    - core/
    - docs/
    - sikula_cli/
    - tools/
    - .sikula/config.yaml
    - AGENTS.md
    - ARCHITECTURE.md
    - CONTRIBUTING.md
    - README.md
    - guidelines.md
    - pyproject.toml
    - sikula.py

  # Directories the TestWriterAgent may write to.
  # The agent is further restricted to test files via its prompt — production files are off-limits.
  allowed_test_write_paths:
    - tests/

  # Directories agents may READ from. "." means the entire project root.
  # Narrow this down if parts of the project should be invisible to agents.
  allowed_read_paths:
    - .

  # Maximum number of build+fix cycles before the task is aborted.
  max_iterations: 10

  # Maximum number of review+implement-fix cycles per review pass.
  max_review_iterations: 3

  # Maximum number of security-review+fix cycles (independent of max_review_iterations).
  max_security_review_iterations: 3

tasks:
  task_description_dir: .sikula/tasks/
  contract_dir: .sikula/contracts/
  task_asset_dir: .sikula/task-assets/
  contract_report_dir: .sikula/contract-reports/
  refined_suffix: .refined.md
  contract_suffix: .contract.md
  state_dir: .sikula/state/

progress:
  # Set to 0 to disable progress heartbeats.
  heartbeat_interval_seconds: 60

# Default LLM settings — apply to all agents unless overridden under agents: below.
# Built-in provider values: codex, claude, gemini, opencode, antigravity.
llm:
  provider: codex
  model: gpt-5.3-codex       # Default model for planner, implementer, test writer, and fixer.
  agent_timeout: 1800        # Seconds to wait for a single agent call before timing out.

# Per-agent LLM overrides — any field omitted falls back to llm: above.
# Analyst, reviewer, and security reviewer benefit most from a stronger model.
# Implementer and fixer work from precise prompts — a faster model is usually sufficient.
agents:
  analyst:
    llm:
      model: gpt-5.5           # Stronger model: analyst output determines the entire task outcome.
  reviewer:
    llm:
      model: gpt-5.5           # Stronger model: thoroughness matters more than speed here.
  security_reviewer:
    llm:
      model: gpt-5.5           # Stronger model: must reliably detect subtle security issues.
# implementer:
#   llm:
#     agent_timeout: 2400      # Increase if the implementer times out on large tasks.
# fixer:
#   llm:
#     model: gpt-5.4-mini     # Faster/cheaper model — fixer works from explicit error output.
# task_preparer:
#   llm:
#     model: gpt-5.5          # Stronger model: product refinement and contract prep set the foundation.

# Run PlannerAgent after the analyst.
# For small/focused tasks it outputs SINGLE_PASS and the loop runs unchanged.
# For larger tasks it breaks the prompt into 2–N ordered steps. Build timing is
# controlled by run_build_per_step below.
run_planner: true

# Run BuildTool.generate_sources() before the analyst.
# Python needs no source generation — leave false.
run_presync: false

# Run build/fix loop after each individual step (true) vs once after all steps (false).
run_build_per_step: false

# Run ReviewerAgent after each implement pass.
# Checks completeness, logical correctness, semantic consistency, dead members,
# and shared function scope. Issues feed back to the implementer.
run_review: true

# Run SecurityReviewerAgent after the review phase.
# This is independent of run_review; if run_review is false, security review still runs
# unless run_security_review is also false.
# Blocking issues (hardcoded secrets, injection, missing auth, weak crypto, PII in logs)
# halt the pipeline and feed back to the implementer.
# Non-blocking warnings are logged in state but do not block.
run_security_review: true

# Enable compile/test/check validation and the build/fix loop.
# Set false to skip compile/test/check validation for this run.
run_build: true

# Run TestWriterAgent after review/security phases complete.
# Instructed to stay within allowed_test_write_paths and avoid production code.
run_test_writing: true

# Run BuildTool.run_tests() after each passing build.
# Requires run_build: true
run_tests: true

# Run named quality checks after tests pass.
# Failures feed the fixer like build errors.
# Checks are defined under build.checks below.
# Requires run_build: true
run_checks: true

# Python / PythonTool build settings.
build:
  # Shell command run by compile_check() in the build/fix loop.
  # compileall catches syntax errors and import mistakes fast — no test run needed.
  compile_command: "python3 -m compileall -q agents/ core/ sikula_cli/ tools/ sikula.py"

  # Shell command run by run_tests() (run_tests: true only).
  test_command: "python3 -m pytest tests/ -v"

  # Timeout in seconds for all PythonTool operations.
  timeout: 300

  # Optional: adopt project-specific source-controlled files generated or updated by sync().
  # PythonTool has no built-in lockfile default, so use this for intentional generated sync outputs.
  # Use this only for generated files that belong in the final diff; keep caches/build outputs gitignored.
  # sync_adopt_paths:
  #   - "src/generated/"
  #   - "schema/generated/**/*.json"

  # Named quality checks run after tests when run_checks: true.
  # command: shell command to run.
  # fix_command: optional shell command run automatically on failure before the fixer agent.
  #              Use only for deterministic formatters (ruff format, black, …).
  checks:
    - name: ruff-check
      command: "python3 -m ruff check ."
      timeout: 60
    - name: ruff-format
      command: "python3 -m ruff format --check ."
      fix_command: "python3 -m ruff format ."
      timeout: 60
    - name: whitespace
      # Covers tracked diffs and untracked text files without mutating the git index.
      command: "python3 tools/check_whitespace.py"
      timeout: 60

# Security context — injected into the security reviewer's prompt to focus the audit on
# threats relevant to this project.
security:
  context: >-
    Local developer tool that orchestrates LLM agents reading and writing local
    source files, running shell commands for build/test/check validation, and
    creating git worktrees and result branches. LLM API keys and provider
    credentials come from environment variables or provider CLIs only. Raw
    `.sikula/state`, prompts, provider output, logs, source snippets, diffs,
    and local filesystem paths are local audit/debug evidence by default, not
    public JSON/protocol output. Main concerns are path traversal, symlink and
    gitfile escape, sandbox enforcement, unsafe shell command construction,
    provider diagnostic leakage, prompt/state privacy, worktree cleanup/delete
    safety, current-branch review-fix delivery safety, and editable-install
    self-hosting mistakes where the invoking `sikula` process loads code from
    the checkout being changed.

# Project guidelines — injected into all agent prompts (analyst, reviewer, and security reviewer
# receive file content directly; implementer, fixer, and test writer receive the file list
# and read them via their tools).
guidelines:
  # Files loaded as project context. List paths relative to project root.
  # Keep this focused — only files that define architecture, conventions, and rules.
  # max_file_chars is higher than the default here because ARCHITECTURE.md is large.
  context_files:
    - guidelines.md
    - ARCHITECTURE.md
    - AGENTS.md
    - CONTRIBUTING.md
    - README.md
  max_file_chars: 50000

# Planner configuration.
planner:
  # Maximum number of steps the planner may produce.
  max_steps: 6

# Reviewer configuration.
reviewer:
  # When review runs, this prompt overlay must be committed/clean before isolated worktree creation.
  extra_rules: .sikula/reviewer_rules.md

# Security reviewer configuration.
security_reviewer:
  # When security review runs, this prompt overlay must be committed/clean before isolated worktree creation.
  extra_rules: .sikula/security_rules.md

# Test writer configuration.
test_writer:
  # Minimum branch+line coverage target within the configured test surface (percentage).
  coverage_target: 90
  # Test surface policy:
  # existing_infrastructure = stay within existing project test infra; missing heavy
  # UI/browser/device/runtime harnesses are not gaps by themselves.
  # complete = opt in to TESTABILITY GAP reports when important behaviour needs missing
  # test infra outside the existing surface.
  test_surface_policy: existing_infrastructure
  # What to do when safe tests require missing project seams/infrastructure:
  # warn = record a visible audit warning; fail = fail the task.
  testability_gap_policy: warn
  # When test writing runs, this prompt overlay must be committed/clean before isolated worktree creation.
  extra_rules: .sikula/test_writer_rules.md
