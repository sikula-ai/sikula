coverage:
  status:
    project:
      default:
        target: 80%
        informational: true   # never blocks merge; coverage is advisory
    patch:
      default:
        target: 90%
        informational: true

comment:
  layout: "header, diff, files, footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false
