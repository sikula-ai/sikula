# Sikula Bun full-stack example — orchestrator configuration
#
# This file is a fully commented example config for a TypeScript app using Bun for
# backend runtime, browser bundling, package management, and tests.
#
# 1. Refine task: sikula task refine .sikula/tasks/<task-file> --auto
# 2. Prepare contract: sikula contract prepare .sikula/tasks/<refined-task-file> --auto
# 3. Run the contract: sikula run .sikula/contracts/<contract-file>
# Or with explicit config from anywhere:
#   sikula --config example/node/countries-bun-fullstack/.sikula/config.yaml run .sikula/tasks/<task-file>

project:
  name: example-countries-bun-fullstack
  root_path: .
  build_tool: node

  # Tech stack — injected into agent prompts (analyst, implementer, reviewer, security reviewer,
  # fixer, test writer). Adapt these values to match your project.
  platform: Web + API
  language: TypeScript
  backend: Bun.serve
  ui: Browser TypeScript

sandbox:
  # Production write scope for implementer and production-code fixer passes.
  # These paths are prompt constraints, not a provider-independent hard sandbox.
  # Sikula audits detected file changes after write-capable agent calls and records
  # write_path_warning if a change is outside the active write scope.
  allowed_write_paths:
    - src/
    - public/
    # Add package.json or scripts/ only for tasks that explicitly change project infrastructure.

  # Directories the TestWriterAgent may write to.
  # Keep this limited to test source roots.
  allowed_test_write_paths:
    - tests/

  # Directories agents may READ from. "." means the entire project root.
  # Narrow this down if parts of the project should be invisible to agents.
  allowed_read_paths:
    - .

  # Maximum number of build+fix cycles before the task is aborted.
  max_iterations: 10

  # Maximum number of review+implement-fix cycles per review pass.
  max_review_iterations: 3

  # Maximum number of security-review+fix cycles (independent of max_review_iterations).
  # Defaults to max_review_iterations if not set.
  max_security_review_iterations: 3

tasks:
  task_description_dir: .sikula/tasks/
  contract_dir: .sikula/contracts/
  task_asset_dir: .sikula/task-assets/
  contract_report_dir: .sikula/contract-reports/
  refined_suffix: .refined.md
  contract_suffix: .contract.md
  state_dir: .sikula/state/

# Default LLM settings — apply to all agents unless overridden under agents: below.
# Built-in provider values: codex, claude, gemini, opencode, antigravity.
llm:
  provider: codex
  model: gpt-5.3-codex       # Default model for planner, implementer, test writer, and fixer.
  agent_timeout: 1800        # Seconds to wait for a single agent call before timing out.

# Per-agent LLM overrides — any field omitted falls back to llm: above.
# Analyst, reviewer, and security reviewer benefit most from a stronger model.
agents:
  analyst:
    llm:
      model: gpt-5.5           # Stronger model: analyst output determines the entire task outcome.
  reviewer:
    llm:
      model: gpt-5.5           # Stronger model: thoroughness matters more than speed here.
  security_reviewer:
    llm:
      model: gpt-5.5           # Stronger model: must reliably detect subtle security issues.
# implementer:
#   llm:
#     agent_timeout: 2400      # Increase if the implementer times out on larger tasks.
# fixer:
#   llm:
#     model: gpt-5.4-mini     # Faster/cheaper model — fixer works from explicit error output.
# task_preparer:
#   llm:
#     model: gpt-5.5          # Stronger model: product refinement and contract prep set the foundation.

# Run PlannerAgent after the analyst.
run_planner: true

# Bun example has no generated sources before analysis.
run_presync: false

# Full-stack changes often need API, client, and tests to land together.
run_build_per_step: false

# Run ReviewerAgent after each implement pass.
run_review: true

# Run SecurityReviewerAgent after the review phase.
run_security_review: true

# Enable compile/test/check validation and the build/fix loop.
run_build: true

# Run TestWriterAgent after review/security phases complete.
run_test_writing: true

# Run BuildTool.run_tests() after each passing build.
run_tests: true

# Run named quality checks after tests pass.
run_checks: true

# NodeTool-specific build settings. Bun is supported through the shared NodeTool.
build:
  # Package manager to use when lockfiles are absent or ambiguous.
  package_manager: bun

  # Install dependencies exactly from bun.lock.
  sync_command: "bun install --frozen-lockfile"

  # Optional: adopt project-specific source-controlled files generated or updated by sync().
  # Platform defaults already cover existing tracked package-manager lockfiles.
  # Use this only for generated files that belong in the final diff; keep caches/build outputs gitignored.
  # sync_adopt_paths:
  #   - "src/generated/api/"
  #   - "schema/generated/**/*.json"

  # TypeScript type checking is the compile gate; bundling runs as a named check below.
  compile_command: "bun run typecheck"

  # Uses bun:test.
  test_command: "bun run test"

  sync_timeout: 60
  compile_timeout: 300
  test_timeout: 300

  # Deterministic quality checks run after tests.
  checks:
    - name: build
      command: "bun run build"
      timeout: 300
    - name: fixtures
      command: "bun run check:fixtures"
      timeout: 120

# Security context — injected into the security reviewer's prompt to focus the audit on
# threats relevant to this project.
security:
  context: Full-stack demo app serving public local country data. No auth, no PII, no persistence, and no financial data. Query parameters and URL path segments are untrusted inputs.

# Project guidelines — injected into all agent prompts (analyst, reviewer, and security reviewer
# receive file content directly; implementer, fixer, and test writer receive the file list
# and read them via their tools).
guidelines:
  context_files:
    - AGENTS.md
    - guidelines.md
  max_file_chars: 20000

planner:
  max_steps: 6

test_writer:
  # Minimum branch+line coverage target within the configured test surface (percentage).
  coverage_target: 90
  # Test surface policy:
  # existing_infrastructure = stay within existing project test infra; missing heavy
  # UI/browser/device/runtime harnesses are not gaps by themselves.
  # complete = opt in to TESTABILITY GAP reports when important behaviour needs missing
  # test infra outside the existing surface.
  test_surface_policy: existing_infrastructure
  # What to do when safe tests require missing project seams/infrastructure:
  # warn = record a visible audit warning; fail = fail the task.
  testability_gap_policy: warn
