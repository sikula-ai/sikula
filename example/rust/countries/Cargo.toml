[package]
name = "countries"
version = "0.1.0"
edition = "2021"

[lib]
name = "countries"
path = "src/lib.rs"

[[bin]]
name = "countries"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
