[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sikula"
version = "0.1.0"
description = "Stateful AI agent pipeline that turns task descriptions into review-ready branches"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [
    {name = "Petr Lexa", email = "contact@sikula.ai"},
]
keywords = ["ai", "llm", "coding-agent", "code-review", "developer-tools", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://sikula.ai"
Repository = "https://github.com/sikula-ai/sikula"
Issues = "https://github.com/sikula-ai/sikula/issues"

[project.scripts]
sikula = "sikula:main"

[tool.setuptools]
py-modules = ["sikula"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "core*", "tools*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:cannot collect test class 'TestWriterAgent':pytest.PytestCollectionWarning"]
